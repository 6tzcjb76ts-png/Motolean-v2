<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#03070d"><title>INCBIKER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;color:#fff;font-family:Arial,Helvetica,sans-serif}.app{position:relative;width:100vw;height:100dvh;max-width:700px;margin:auto;overflow:hidden;background:#02060b}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}.val{position:absolute;z-index:7;text-align:center;font-weight:900;line-height:1;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none;transform:translate(-50%,-50%)}.cover{position:absolute;z-index:6;pointer-events:none;background:linear-gradient(145deg,rgba(1,9,17,.97),rgba(0,5,12,.97));border:1px solid rgba(27,155,230,.25);border-radius:12px;box-shadow:inset 0 0 18px rgba(0,115,220,.08)}
.cover.left{left:8.7%;top:43.4%;width:16%;height:6.4%}.cover.right{left:75.5%;top:43.4%;width:16%;height:6.4%}.cover.current{left:41%;top:48.1%;width:18%;height:5.7%;border-color:rgba(30,180,255,.32)}.cover.maxl{left:17.3%;top:68.3%;width:15.6%;height:5.2%}.cover.maxr{left:67.1%;top:68.3%;width:15.6%;height:5.2%}
.left{left:16.7%;top:46.1%;width:18%;font-size:clamp(30px,8vw,56px)}.right{left:83.4%;top:46.1%;width:18%;font-size:clamp(30px,8vw,56px)}.current{left:50%;top:50.5%;width:28%;font-size:clamp(34px,9vw,60px);color:#e7faff}.maxl{left:25%;top:70%;width:22%;font-size:clamp(28px,7vw,48px);color:#ff3045}.maxr{left:75%;top:70%;width:22%;font-size:clamp(28px,7vw,48px);color:#ff3045}.hit{position:absolute;z-index:5;border:0;background:transparent;padding:0}.modal{position:absolute;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#000b}.panel{width:100%;max-width:440px;max-height:85%;overflow:auto;padding:20px;border:1px solid #12baff;border-radius:18px;background:linear-gradient(145deg,#071727,#02060b);box-shadow:0 0 30px #008cff55}.panel h2{margin:0 0 14px;font-size:21px}.panel label{display:block;font-size:12px;color:#9edcff;margin:12px 0 5px}.panel input,.panel select{width:100%;padding:12px;background:#091827;color:#fff;border:1px solid #46657c;border-radius:9px;font-size:16px}.panel input[type=checkbox]{width:auto}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1;padding:12px;border-radius:10px;border:1px solid #18baff;background:#061c30;color:#fff;font-weight:bold}.actions .primary{background:#007ee9}.entry{padding:9px 0;border-bottom:1px solid #234154;font-size:12px}.small{font-size:12px;color:#9cb6ca;line-height:1.5}.toast{position:absolute;z-index:30;bottom:9%;left:10%;right:10%;padding:12px;background:#061a29;border:1px solid #16caff;border-radius:12px;text-align:center;display:none;font-size:13px}.status{position:absolute;z-index:8;left:16%;right:16%;top:6%;padding:8px;background:#071521ed;border:1px solid #18caff;border-radius:10px;font-size:12px;text-align:center;display:none}.pointer{position:absolute;z-index:8;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;filter:drop-shadow(0 0 5px #00ff58);pointer-events:none}.pointer.l{border-right:18px solid #00ff58;left:7%;top:26%;transform:translate(-50%,-50%)}.pointer.r{border-left:18px solid #00ff58;right:7%;top:26%;transform:translate(50%,-50%)}
</style></head><body><main class="app" id="app">
<img class="art" src="interfaz-incbiker.jpg" alt="Interfaz INCBIKER">
<div class="cover left"></div><div class="cover right"></div><div class="cover current"></div><div class="cover maxl"></div><div class="cover maxr"></div><div class="val left" id="leftVal">0°</div><div class="val right" id="rightVal">0°</div><div class="val current" id="currentVal">0°</div><div class="val maxl" id="maxLeft">0°</div><div class="val maxr" id="maxRight">0°</div>
<div class="pointer l" id="leftPointer"></div><div class="pointer r" id="rightPointer"></div><div class="status" id="status"></div>
<button class="hit" style="left:3%;top:4%;width:12%;height:5%" onclick="openModal('settings')" aria-label="Ajustes"></button>
<button class="hit" style="left:5%;top:55.5%;width:22%;height:9%" onclick="toggleSensor()" aria-label="Activar sensor"></button><button class="hit" style="left:29%;top:55.5%;width:22%;height:9%" onclick="calibrate()" aria-label="Calibrar cero"></button><button class="hit" style="left:52%;top:55.5%;width:22%;height:9%" onclick="toggleDemo()" aria-label="Modo demo"></button><button class="hit" style="left:74%;top:55.5%;width:22%;height:9%" onclick="toggleRecord()" aria-label="Iniciar registro"></button><button class="hit" style="left:5%;top:72%;width:90%;height:14%" onclick="openModal('bike')" aria-label="Mi motocicleta"></button><button class="hit" style="left:5%;top:89%;width:22%;height:8%" onclick="toast('Pantalla de inclinación')"></button><button class="hit" style="left:28%;top:89%;width:22%;height:8%" onclick="openModal('sensor')"></button><button class="hit" style="left:52%;top:89%;width:22%;height:8%" onclick="openModal('records')"></button><button class="hit" style="left:75%;top:89%;width:22%;height:8%" onclick="openModal('settings')"></button>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><section class="panel" id="panel"></section></div><div class="toast" id="toast"></div></main>
<script>
const $=id=>document.getElementById(id);let sensorOn=false,recording=false,demoOn=false,zero=0,current=0,maxLeft=0,maxRight=0,lastAlarm=0,sensorHandler=null,audioCtx=null,demoTimer=null,records=[];let settings={alarm:true,threshold:45,reset:42,beeps:2};let bike={brand:'Voge',model:'525 DSX',category:'Trail / Adventure',year:'2024'};try{records=JSON.parse(localStorage.getItem('ml_records')||'[]');settings={...settings,...JSON.parse(localStorage.getItem('ml_settings')||'{}')};bike={...bike,...JSON.parse(localStorage.getItem('ml_bike')||'{}')}}catch(e){}
function persist(){try{localStorage.setItem('ml_records',JSON.stringify(records));localStorage.setItem('ml_settings',JSON.stringify(settings));localStorage.setItem('ml_bike',JSON.stringify(bike))}catch(e){}}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}function paint(){ $('leftVal').textContent=Math.max(0,-current)+'°';$('rightVal').textContent=Math.max(0,current)+'°';$('currentVal').textContent=Math.abs(current)+'°';$('maxLeft').textContent=maxLeft+'°';$('maxRight').textContent=maxRight+'°';let a=Math.min(60,Math.abs(current));let x=16.5-9*Math.sin(a*Math.PI/120);let y=40.0-(28*(a/60));$('leftPointer').style.left=x+'%';$('leftPointer').style.top=y+'%';$('rightPointer').style.right=x+'%';$('rightPointer').style.top=y+'%';$('leftPointer').style.display=current<0?'block':'none';$('rightPointer').style.display=current>=0?'block':'none'}
function beep(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();for(let i=0;i<settings.beeps;i++){let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=880;g.gain.value=.16;o.connect(g);g.connect(audioCtx.destination);let st=audioCtx.currentTime+i*.24;o.start(st);o.stop(st+.13)}}catch(e){toast('No se pudo reproducir el sonido en este navegador')}}function processAngle(a){current=Math.round(a-zero);if(current<0)maxLeft=Math.max(maxLeft,Math.abs(current));else maxRight=Math.max(maxRight,current);if(settings.alarm&&Math.abs(current)>=Number(settings.threshold)&&Date.now()-lastAlarm>1800){lastAlarm=Date.now();beep();toast('AVISO: '+Math.abs(current)+'° de inclinación')}if(Math.abs(current)<Number(settings.reset))lastAlarm=0;paint();if(recording){let last=records[records.length-1];if(!last||Date.now()-last.t>1000){records.push({t:Date.now(),a:current,bike:bike.brand+' '+bike.model});if(records.length>5000)records.shift();persist()}}}
async function toggleSensor(){if(sensorOn){window.removeEventListener('deviceorientation',sensorHandler);sensorOn=false;$('status').style.display='block';$('status').textContent='SENSOR DESACTIVADO';toast('Sensor desactivado');return}try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){let p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error('Permiso denegado')}sensorHandler=e=>{if(e.gamma!==null&&e.gamma!==undefined)processAngle(e.gamma)};window.addEventListener('deviceorientation',sensorHandler,true);sensorOn=true;$('status').style.display='block';$('status').textContent='SENSOR ACTIVO · lectura orientativa del teléfono';toast('Sensor activado')}catch(e){$('status').style.display='block';$('status').textContent='No se pudo activar. Usa Safari con HTTPS y concede permiso de movimiento.';toast('No se pudo activar el sensor')}}function calibrate(){zero=current;maxLeft=0;maxRight=0;paint();toast('Cero calibrado')}function toggleRecord(){recording=!recording;toast(recording?'Registro iniciado':'Registro detenido');if(!recording)persist()}function toggleDemo(){demoOn=!demoOn;if(demoOn){let i=0;demoTimer=setInterval(()=>processAngle(Math.round(48*Math.sin(i++/10))),160);toast('Modo demo activado')}else{clearInterval(demoTimer);toast('Modo demo desactivado')}}
function openModal(which){let p=$('panel');$('modal').style.display='flex';if(which==='settings'){p.innerHTML=`<h2>⚙ Ajustes de INCBIKER</h2><label><input id="alarm" type="checkbox" ${settings.alarm?'checked':''}> Aviso acústico</label><label>Ángulo de aviso (grados)</label><input id="threshold" type="number" min="10" max="80" value="${settings.threshold}"><label>Rearmar aviso por debajo de (grados)</label><input id="reset" type="number" min="0" max="79" value="${settings.reset}"><label>Número de tonos</label><select id="beeps"><option value="1">1 tono</option><option value="2" ${settings.beeps===2?'selected':''}>2 tonos</option><option value="3" ${settings.beeps===3?'selected':''}>3 tonos</option></select><div class="small">El sensor del teléfono mide su propia orientación, que puede no coincidir con la inclinación real de la moto.</div><div class="actions"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveSettings()">Guardar</button></div>`}else if(which==='bike'){p.innerHTML=`<h2>🏍 Mi motocicleta</h2><label>Marca</label><select id="brand">${['Voge','BMW','Honda','Yamaha','Suzuki','Ducati','KTM','Kawasaki','Otra'].map(x=>`<option ${bike.brand===x?'selected':''}>${x}</option>`).join('')}</select><label>Modelo</label><input id="model" value="${bike.model}"><label>Categoría</label><select id="category">${['Trail / Adventure','Naked','Sport / R','Touring','Custom','Scooter','Enduro'].map(x=>`<option ${bike.category===x?'selected':''}>${x}</option>`).join('')}</select><label>Año / versión</label><input id="year" value="${bike.year}"><div class="actions"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveBike()">Guardar moto</button></div>`}else if(which==='records'){p.innerHTML=`<h2>▥ Registro de inclinación</h2><p class="small">Máxima izquierda: ${maxLeft}° · máxima derecha: ${maxRight}°</p><div class="actions"><button onclick="exportCSV()">Exportar CSV</button><button onclick="clearRecords()">Borrar</button></div><div>${records.slice(-100).reverse().map(r=>`<div class="entry">${new Date(r.t).toLocaleString()} · ${r.a}° · ${r.bike||''}</div>`).join('')||'<p class="small">Todavía no hay registros.</p>'}</div><div class="actions"><button onclick="closeModal()">Cerrar</button></div>`}else{p.innerHTML=`<h2>◎ Sensor</h2><p>${sensorOn?'Sensor activado':'Sensor desactivado'}</p><p class="small">Abre la app desde Safari con HTTPS y concede el permiso de movimiento. No uses la pantalla mientras conduces.</p><div class="actions"><button onclick="closeModal()">Cerrar</button><button class="primary" onclick="closeModal();toggleSensor()">${sensorOn?'Desactivar':'Activar'} sensor</button></div>`}}
function closeModal(){$('modal').style.display='none'}function saveSettings(){settings.alarm=$('alarm').checked;settings.threshold=Math.max(10,Math.min(80,Number($('threshold').value)||45));settings.reset=Math.max(0,Math.min(settings.threshold-1,Number($('reset').value)||42));settings.beeps=Math.max(1,Math.min(3,Number($('beeps').value)||2));persist();closeModal();toast('Ajustes guardados')}function saveBike(){bike={brand:$('brand').value,model:$('model').value||'Mi moto',category:$('category').value,year:$('year').value||'—'};persist();closeModal();toast('Moto guardada')}function exportCSV(){let csv='fecha,hora,angulo,moto\n'+records.map(r=>`"${new Date(r.t).toLocaleDateString()} ","${new Date(r.t).toLocaleTimeString()}",${r.a},"${r.bike||''}"`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='INCBIKER-registro.csv';a.click()}function clearRecords(){if(confirm('¿Borrar todos los registros?')){records=[];persist();openModal('records')}}paint();
</script></body></html>
